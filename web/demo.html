<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>d1-3B decisions in the browser</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14171c; --muted: #5d6573; --line: #dde1e7; --accent: #2457d6;
    --accent-soft: #dfe8fc; --bad: #b42318; --bar: #2457d6; --bar-bg: #e9ecf1; --chip: #eef1f5; --flash: #fff2c2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --panel: #1a1e24; --ink: #eef1f5; --muted: #9aa3b2; --line: #2c323b; --accent: #7aa2ff;
            --accent-soft: #1f2a44; --bad: #ff7a6b; --bar: #7aa2ff; --bar-bg: #2a3039; --chip: #232830; --flash: #4a3f12; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.35 "Segoe UI", system-ui, -apple-system, sans-serif; }
  header { padding: 10px 20px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
  #where { margin-top: 2px; color: var(--muted); font-size: 12.5px; }
  main { display: grid; grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr); gap: 14px; padding: 12px 20px 14px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 12px 16px; } header { padding: 10px 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; min-width: 0; }
  h2 { margin: 0 0 6px; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  h2 span { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 8px; padding: 5px 11px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  textarea, input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; width: 100%; }
  textarea { resize: vertical; overflow: hidden; font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: 13px; line-height: 1.4; }
  #state { min-height: 46px; }
  .examples { margin-bottom: 8px; }
  .examples button { font-size: 13px; }
  .examples .on { border-color: var(--accent); background: var(--accent-soft); }
  .qed { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; display: grid; grid-template-columns: 96px 104px minmax(0, 1fr) 28px; gap: 5px 6px; }
  .qed textarea { grid-column: 1 / -1; min-height: 28px; }
  .qed .x { padding: 2px 0; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .devices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .dev { text-align: left; padding: 6px 10px; border-radius: 9px; border: 2px solid var(--line); background: var(--chip); }
  .dev .name { font-size: 17px; font-weight: 650; }
  .dev .st { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev.on { border-color: var(--accent); background: var(--accent-soft); }
  .dev.failed .st { color: var(--bad); }
  #decide { margin-top: 8px; width: 100%; padding: 8px; font-size: 17px; font-weight: 650; background: var(--accent); color: #fff; border-color: var(--accent); }
  #decide:disabled { background: var(--chip); color: var(--muted); border-color: var(--line); }
  #summary { margin: 7px 0 0; min-height: 18px; color: var(--muted); font-size: 12.5px; }
  .card { border: 1px solid var(--line); border-radius: 9px; padding: 6px 11px 7px; margin-top: 7px; }
  .card.changed { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: var(--flash); } to { background: transparent; } }
  .card .top { display: flex; align-items: baseline; gap: 10px; }
  .card .qname { font-size: 12.5px; color: var(--muted); min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .ms { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .card .ms small { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .card .body { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 10px; align-items: center; }
  .card .ans { font-size: 19px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
  .card .ans small { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .bars { display: grid; grid-template-columns: minmax(56px, max-content) minmax(0, 1fr) 46px; gap: 1px 8px; align-items: center; font-size: 12.5px; }
  .bars .lab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .bars .lab.win { font-weight: 700; }
  .bar { height: 9px; background: var(--bar-bg); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--bar); border-radius: 5px; }
  .bars .pct { text-align: right; font-variant-numeric: tabular-nums; }
  .hist { margin-top: 3px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hist b { color: var(--ink); font-weight: 600; }
  .err { color: var(--bad); white-space: pre-wrap; font-size: 12.5px; }
  details { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  #log { max-height: 160px; overflow: auto; white-space: pre-wrap; font: 12px/1.35 ui-monospace, Consolas, monospace; }
  #cursor { position: fixed; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; z-index: 9; display: none;
            border-radius: 50%; background: rgba(36, 87, 214, 0.25); border: 2px solid rgba(36, 87, 214, 0.9); transition: left 0.25s ease, top 0.25s ease; }
</style>
</head>
<body>
<header>
  <h1>d1-3B typed decisions, in the browser on this laptop</h1>
  <div id="where">loading…</div>
</header>
<main>
  <section id="left">
    <div class="row examples" id="examples"></div>
    <h2>State <span>(text, or JSON)</span></h2>
    <textarea id="state" spellcheck="false"></textarea>
    <div id="questions"></div>
    <div class="row" style="margin-top:8px"><button id="addq">+ question</button></div>
  </section>
  <section id="right">
    <h2>Run on</h2>
    <div class="devices" id="devices"></div>
    <button id="decide" disabled>Decide</button>
    <div id="summary"></div>
    <div id="answers"></div>
    <details><summary>log</summary><div id="log"></div></details>
  </section>
</main>
<div id="cursor"></div>
<script type="module" src="demo.mjs"></script>
</body>
</html>
